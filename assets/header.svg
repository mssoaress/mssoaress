    <radialGradient id="glow"><stop stop-color="#8FF638" stop-opacity=".13"/><stop offset="1" stop-color="#8FF638" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#AFD2B4" stroke-opacity=".055"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="378" rx="22"/></clipPath>
