name: Update contribution snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mssoaress
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235AAB16&color_dots=%23ebedf0,%23d1f5ad,%239ee45b,%236cbe2b,%233b7d15
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%238FF638&color_dots=%23161b22,%23213e1b,%23385f21,%235d9c29,%238FF638
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
